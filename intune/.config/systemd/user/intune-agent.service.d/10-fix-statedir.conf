[Service]
# Fix for hands-off Intune background check-in on Ubuntu/GNOME.
#
# The shipped intune-agent.service sets `StateDirectory=intune`, which forces
# $STATE_DIRECTORY=~/.local/state/intune. But intune-portal writes the device
# registration (registration.toml) to ~/.config/intune. The timer-driven agent
# therefore finds no registration and exits with
#   "Skipping checkin with Intune: Cannot checkin before a user logs in"
# so check-ins only ever happen when the Intune app is opened manually.
#
# Clearing StateDirectory and pointing $STATE_DIRECTORY at ~/.config/intune lets
# the background agent read the registration and check in on its own (hourly).
# %h = the user's home directory (portable across machines/usernames).
#
# Prerequisite: the device must already be enrolled (open "Microsoft Intune" and
# sign in once) so that ~/.config/intune/registration.toml exists.
#
# Observed on intune-portal 1.2605.16 / microsoft-identity-broker 3.0.2 (Ubuntu
# 24.04). If a future package version moves registration to ~/.local/state/intune,
# this drop-in becomes unnecessary and should be removed (see setup-intune-checkin).
StateDirectory=
Environment=STATE_DIRECTORY=%h/.config/intune
