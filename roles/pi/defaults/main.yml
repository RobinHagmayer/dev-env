---
pi_apt_packages:
  - ca-certificates
  - curl
  - util-linux # setsid prevents the installer from opening /dev/tty for prompts
pi_bin_dir: "{{ ansible_facts['user_dir'] }}/.local/bin"
pi_agent_dir: "{{ ansible_facts['user_dir'] }}/.pi/agent"
pi_installer_dir: "{{ ansible_facts['user_dir'] }}/.cache/ansible-installers"
