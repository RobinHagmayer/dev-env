---
- name: Install system packages for Ghostty
  ansible.builtin.apt:
    name: "{{ ghostty_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [packages]

- name: Require an exact Ghostty release
  ansible.builtin.assert:
    that: ghostty_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: Pin a stable release and its checksum; floating tip builds are not supported.

- name: Resolve pinned Ghostty release source
  ansible.builtin.set_fact:
    ghostty_source_url: "https://release.files.ghostty.org/{{ ghostty_version }}/ghostty-{{ ghostty_version }}.tar.gz"
    ghostty_source_checksum: "sha256:{{ ghostty_sha256 }}"
    ghostty_source_id: "{{ ghostty_version }}"

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ghostty_src_dir }}"
    - "{{ ghostty_download_dir }}"

- name: Download Ghostty source tarball
  ansible.builtin.get_url:
    url: "{{ ghostty_source_url }}"
    dest: "{{ ghostty_download_dir }}/ghostty-{{ ghostty_source_id }}.tar.gz"
    checksum: "{{ ghostty_source_checksum }}"
    mode: "0644"
  # A dry run cannot create the cache/source directories needed below.
  when: not ansible_check_mode

- name: Unpack Ghostty source
  ansible.builtin.unarchive:
    src: "{{ ghostty_download_dir }}/ghostty-{{ ghostty_source_id }}.tar.gz"
    dest: "{{ ghostty_src_dir }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ ghostty_src_dir }}/build.zig"
  when: not ansible_check_mode

- name: Check Zig version
  ansible.builtin.command: "{{ ghostty_zig }} version"
  register: ghostty_zig_check
  changed_when: false
  failed_when: ghostty_zig_check.rc != 0 and not ansible_check_mode
  check_mode: false

- name: Check Zig version matches what Ghostty requires
  ansible.builtin.assert:
    that: ghostty_zig_check.stdout | trim == ghostty_zig_version
    fail_msg: >-
      Ghostty {{ ghostty_version }} needs Zig {{ ghostty_zig_version }},
      found {{ ghostty_zig_check.stdout | trim }}. Check ghostty_zig_version,
      ghostty_zig_sha256 and the ghostty_zig executable path.
  when: not ansible_check_mode

- name: Calculate Ghostty build signature
  ansible.builtin.set_fact:
    ghostty_build_signature: >-
      {{ [ghostty_version, ghostty_source_checksum, ghostty_prefix,
          ghostty_build_flags, ghostty_zig, ghostty_zig_version]
         | to_json | hash('sha256') }}

- name: Check installed Ghostty binary
  ansible.builtin.stat:
    path: "{{ ghostty_prefix }}/bin/ghostty"
  register: ghostty_binary

- name: Check for an existing build record
  ansible.builtin.stat:
    path: "{{ ghostty_prefix }}/.ghostty-build"
  register: ghostty_installed

- name: Read existing build record
  ansible.builtin.slurp:
    src: "{{ ghostty_prefix }}/.ghostty-build"
  register: ghostty_build_record
  when: ghostty_installed.stat.exists

- name: Build and install Ghostty with the requested settings
  # A dry run cannot build source or record a successful installation.
  when:
    - not ansible_check_mode
    - >-
      not ghostty_binary.stat.exists or
      not (ghostty_binary.stat.executable | default(false)) or
      (ghostty_build_record.content | default('') | b64decode | trim) != ghostty_build_signature
  block:
    - name: Build and install Ghostty
      ansible.builtin.command:
        cmd: "{{ ghostty_zig }} build -p {{ ghostty_prefix }} {{ ghostty_build_flags | join(' ') }}"
        chdir: "{{ ghostty_src_dir }}"
      changed_when: true

    - name: Record the successful build settings
      ansible.builtin.copy:
        content: "{{ ghostty_build_signature }}\n"
        dest: "{{ ghostty_prefix }}/.ghostty-build"
        mode: "0644"

# Keep this outside the build block so reruns also repair existing installs.
- name: Ensure Ghostty can find the bundled GTK layer shell library
  when:
    - not ansible_check_mode
    - "'-fno-sys=gtk4-layer-shell' in ghostty_build_flags"
  block:
    - name: Read the installed Ghostty library search path
      ansible.builtin.command:
        argv:
          - patchelf
          - --print-rpath
          - "{{ ghostty_prefix }}/bin/ghostty"
      register: ghostty_rpath
      changed_when: false

    - name: Add the installation library directory to Ghostty's search path
      ansible.builtin.command:
        argv:
          - patchelf
          - --set-rpath
          - "{{ '$ORIGIN/../lib' ~ (':' ~ ghostty_rpath.stdout if ghostty_rpath.stdout | length > 0 else '') }}"
          - "{{ ghostty_prefix }}/bin/ghostty"
        expand_argument_vars: false
      when: "'$ORIGIN/../lib' not in ghostty_rpath.stdout.split(':')"
      changed_when: true
