---
- name: Install system packages for Neovim
  ansible.builtin.apt:
    name: "{{ neovim_apt_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [packages]

- name: Check supported architecture
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: The DEB file name below is only checked for x86_64.

- name: Check out Neovim source
  ansible.builtin.git:
    repo: "{{ neovim_repo }}"
    dest: "{{ neovim_src_dir }}"
    version: "{{ neovim_version }}"

- name: Check for an existing install of this version
  ansible.builtin.stat:
    path: "{{ neovim_src_dir }}/.installed-{{ neovim_version }}"
  register: neovim_installed

# Building a DEB (instead of `make install`) lets dpkg remove all files again.
# BUILD.md calls this an unsupported, best-effort feature of the build.
- name: Build Neovim and package it as DEB
  when: not neovim_installed.stat.exists
  block:
    - name: Remove previous build output
      ansible.builtin.command:
        cmd: make distclean
        chdir: "{{ neovim_src_dir }}"
      changed_when: false

    - name: Build Neovim
      ansible.builtin.command:
        cmd: "make CMAKE_BUILD_TYPE={{ neovim_build_type }}"
        chdir: "{{ neovim_src_dir }}"
      changed_when: true

    - name: Create DEB package
      ansible.builtin.command:
        cmd: cpack -G DEB
        chdir: "{{ neovim_src_dir }}/build"
      changed_when: true

    - name: Install DEB package
      ansible.builtin.apt:
        deb: "{{ neovim_src_dir }}/build/nvim-linux-x86_64.deb"
        state: present
      become: true
      register: neovim_install
      tags: [packages]

    - name: Record the installed version
      ansible.builtin.copy:
        content: "{{ neovim_version }}\n"
        dest: "{{ neovim_src_dir }}/.installed-{{ neovim_version }}"
        mode: "0644"
        force: false
      when: neovim_install is not skipped
