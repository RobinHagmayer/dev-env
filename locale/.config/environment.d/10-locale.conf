# Regional formats follow Germany; the display language stays English (LANG).
# environment.d is read by the systemd user session, so GUI apps such as
# Microsoft Edge inherit it. Requires the de_DE.UTF-8 locale (Ansible role `locale`).
LC_TIME=de_DE.UTF-8
LC_MONETARY=de_DE.UTF-8
LC_NUMERIC=de_DE.UTF-8
LC_MEASUREMENT=de_DE.UTF-8
LC_PAPER=de_DE.UTF-8
# Chromium/Edge format native <input type="time"> (e.g. HaloPSA timesheet start
# and finish times) with their UI locale, not LC_TIME. en_GB keeps English UI
# text but gives 24-hour time pickers.
LANGUAGE=en_GB:en
