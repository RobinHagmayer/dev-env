---
# Packages from https://github.com/neovim/neovim/blob/master/BUILD.md (Ubuntu / Debian).
neovim_apt_packages:
  - build-essential
  - ca-certificates # HTTPS downloads
  - cmake
  - curl # used by the build to fetch bundled dependencies
  - gettext
  - git
  - ninja-build

# Stable system install by default; the modern playbook uses a pinned HEAD
# commit and a separate user prefix. Check breaking changes before upgrading:
# https://neovim.io/doc/user/news.html#news-breaking
neovim_version: "v0.12.5"
neovim_repo: https://github.com/neovim/neovim.git
neovim_src_dir: "{{ ansible_facts['user_dir'] }}/.local/src/neovim"
neovim_build_type: RelWithDebInfo

# User-prefix installs never replace the system binary or old runtime files.
neovim_user_install: false
neovim_install_prefix: "{{ ansible_facts['user_dir'] }}/.local/opt/nvim-modern"
