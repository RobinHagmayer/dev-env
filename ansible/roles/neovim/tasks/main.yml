---
- name: Install or validate system packages for neovim
  ansible.builtin.include_role:
    name: system_packages
    apply:
      tags: [packages]
  vars:
    system_packages_names: "{{ neovim_apt_packages }}"
    system_packages_bootstrap_playbook: "{{ 'neovim-modern.yml' if neovim_user_install else 'neovim.yml' }}"
  tags: [packages]

- name: Check supported architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'x86_64'
      - neovim_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$') or (neovim_user_install and neovim_version is match('^[0-9a-f]{40}$'))
    fail_msg: The DEB file name below is only checked for x86_64.

- name: Check installed Neovim package version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - '-f=${Status}\n${Version}\n'
      - neovim
  register: neovim_installed
  changed_when: false
  failed_when: neovim_installed.rc not in [0, 1]
  check_mode: false
  when: not neovim_user_install

- name: Require the pinned system Neovim in sudo-free mode
  when:
    - not neovim_user_install
    - not (manage_system_packages | default(true))
  ansible.builtin.assert:
    that:
      - neovim_installed.rc == 0
      - neovim_installed.stdout_lines | first == 'install ok installed'
      - (neovim_installed.stdout_lines | last).split('-')[0] == neovim_version | regex_replace('^v', '')
    fail_msg: >-
      The system Neovim DEB requires sudo to update. Run: uv run ansible-playbook playbooks/neovim.yml --ask-become-pass
    quiet: true

# Reuse a checkout already at its immutable pin. Unnecessary --tags fetches can
# fail when upstream moves its unrelated nightly/stable tags.
- name: Inspect the Neovim source checkout
  ansible.builtin.stat:
    path: "{{ neovim_src_dir }}/.git"
  register: neovim_source_git

- name: Compare the pinned source commit with the current checkout
  ansible.builtin.command:
    argv: [git, -C, "{{ neovim_src_dir }}", rev-parse, "{{ neovim_version }}^{commit}", HEAD]
  register: neovim_local_pin
  changed_when: false
  failed_when: false
  check_mode: false
  when: neovim_source_git.stat.exists

- name: Inspect the source remote before reusing the checkout
  ansible.builtin.command:
    argv: [git, -C, "{{ neovim_src_dir }}", remote, get-url, origin]
  register: neovim_local_origin
  changed_when: false
  failed_when: false
  check_mode: false
  when: neovim_source_git.stat.exists

- name: Inspect tracked source modifications before reusing the checkout
  ansible.builtin.command:
    argv: [git, -C, "{{ neovim_src_dir }}", status, --porcelain, --untracked-files=no]
  register: neovim_local_changes
  changed_when: false
  failed_when: false
  check_mode: false
  when: neovim_source_git.stat.exists

- name: Check out Neovim source
  ansible.builtin.git:
    repo: "{{ neovim_repo }}"
    dest: "{{ neovim_src_dir }}"
    version: "{{ neovim_version }}"
    update: >-
      {{ neovim_local_pin.rc | default(1) != 0 or
         neovim_local_pin.stdout_lines | default([]) | length != 2 or
         neovim_local_pin.stdout_lines[0] != neovim_local_pin.stdout_lines[1] or
         neovim_local_origin.stdout | default('') != neovim_repo or
         neovim_local_changes.stdout | default('') | length > 0 }}

# Building a DEB (instead of `make install`) lets dpkg remove all files again.
# BUILD.md calls this an unsupported, best-effort feature of the build.
- name: Build Neovim and package it as DEB
  # A dry run cannot build the DEB needed by the installation task.
  when:
    - manage_system_packages | default(true)
    - not neovim_user_install
    - not ansible_check_mode
    - >-
      neovim_installed.rc != 0 or
      neovim_installed.stdout_lines | first != 'install ok installed' or
      (neovim_installed.stdout_lines | last).split('-')[0] !=
      neovim_version | regex_replace('^v', '')
  block:
    - name: Remove previous build output
      ansible.builtin.command:
        cmd: make distclean
        chdir: "{{ neovim_src_dir }}"
      changed_when: false

    - name: Build Neovim
      ansible.builtin.command:
        cmd: "make CMAKE_BUILD_TYPE={{ neovim_build_type }}"
        chdir: "{{ neovim_src_dir }}"
      changed_when: true

    - name: Create DEB package
      ansible.builtin.command:
        cmd: cpack -G DEB
        chdir: "{{ neovim_src_dir }}/build"
      changed_when: true

    - name: Install DEB package
      ansible.builtin.apt:
        deb: "{{ neovim_src_dir }}/build/nvim-linux-x86_64.deb"
        state: present
        allow_downgrade: true
      become: true
      tags: [packages]

# Parallel nightly builds are opt-in and install as the normal user.
- name: Inspect the user-prefix Neovim build signature
  ansible.builtin.slurp:
    src: "{{ neovim_install_prefix }}/.build-signature"
  register: neovim_user_signature
  failed_when: false
  when: neovim_user_install

- name: Inspect the user-prefix Neovim binary
  ansible.builtin.stat:
    path: "{{ neovim_install_prefix }}/bin/nvim"
  register: neovim_user_binary
  when: neovim_user_install

- name: Build and install isolated Neovim
  when:
    - neovim_user_install
    - not ansible_check_mode
    - >-
      not neovim_user_binary.stat.exists or
      (neovim_user_signature.content | default('') | b64decode | trim) !=
      neovim_version ~ ':' ~ neovim_build_type
  block:
    - name: Clean previous isolated build output
      ansible.builtin.command:
        argv: [make, distclean]
        chdir: "{{ neovim_src_dir }}"
      changed_when: false

    - name: Build isolated Neovim
      ansible.builtin.command:
        argv:
          - make
          - "CMAKE_BUILD_TYPE={{ neovim_build_type }}"
          - "CMAKE_INSTALL_PREFIX={{ neovim_install_prefix }}"
        chdir: "{{ neovim_src_dir }}"
      changed_when: true

    - name: Install isolated Neovim without sudo
      ansible.builtin.command:
        argv: [cmake, --install, build]
        chdir: "{{ neovim_src_dir }}"
      changed_when: true

    - name: Verify isolated Neovim starts
      ansible.builtin.command:
        argv: ["{{ neovim_install_prefix }}/bin/nvim", --clean, --headless, "+qa"]
      changed_when: false

    - name: Record the successful isolated build signature
      ansible.builtin.copy:
        content: "{{ neovim_version }}:{{ neovim_build_type }}\n"
        dest: "{{ neovim_install_prefix }}/.build-signature"
        mode: "0644"
