---
pnpm_apt_packages:
  - ca-certificates # HTTPS downloads
  - curl # used by the pnpm installer
pnpm_version: "12.15.0"
# Exact Node.js release, managed by pnpm runtime.
pnpm_node_version: "24.22.1"
# pnpm runtime installs Node.js without npm; install npm separately for Pi.
pnpm_npm_version: "12.2.1"
pnpm_home: "{{ ansible_facts['user_dir'] }}/.local/share/pnpm"
