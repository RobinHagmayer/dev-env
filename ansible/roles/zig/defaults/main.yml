---
zig_apt_packages:
  - ca-certificates # HTTPS downloads
  - xz-utils # unpack the .tar.xz tarball
zig_version: "0.17.0"
# Dependencies such as Ghostty use the versioned executable directly.
zig_link_binary: true
# sha256 of zig-x86_64-linux-<version>.tar.xz, from https://ziglang.org/download/index.json
zig_sha256: "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026"
zig_install_dir: "{{ ansible_facts['user_dir'] }}/.local/opt/zig-{{ zig_version }}"
zig_bin_dir: "{{ ansible_facts['user_dir'] }}/.local/bin"
zig_download_dir: "{{ ansible_facts['user_dir'] }}/.cache/ansible-downloads"
