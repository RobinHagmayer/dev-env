---
- name: Check supported distribution for the Fish PPA
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: The Fish PPA role supports Ubuntu only.

- name: Install or validate system packages for Fish
  ansible.builtin.include_role:
    name: system_packages
    apply:
      tags: [packages]
  vars:
    system_packages_names: "{{ fish_apt_packages }}"
    system_packages_bootstrap_playbook: fish.yml
  tags: [packages]

- name: Validate the pinned Fish without sudo
  when: not (manage_system_packages | default(true))
  tags: [packages]
  block:
    - name: Read the installed Fish package
      ansible.builtin.command:
        argv: [dpkg-query, --show, "--showformat=${db:Status-Status} ${Version}", fish]
        expand_argument_vars: false
      register: fish_readonly_package
      changed_when: false
      failed_when: fish_readonly_package.rc not in [0, 1]
      check_mode: false

    - name: Require the pinned Fish package
      ansible.builtin.assert:
        that:
          - fish_readonly_package.rc == 0
          - fish_readonly_package.stdout | trim == 'installed ' ~ fish_version
        fail_msg: >-
          Fish must already be installed at {{ fish_version }} in sudo-free mode.
          Run: uv run ansible-playbook playbooks/fish.yml --ask-become-pass
        quiet: true

    - name: Read the Fish package hold
      ansible.builtin.command:
        argv: [dpkg, --get-selections, fish]
      register: fish_readonly_hold
      changed_when: false
      check_mode: false

    - name: Require the Fish version hold
      ansible.builtin.assert:
        that: fish_readonly_hold.stdout.split() | last == 'hold'
        fail_msg: >-
          Fish must be held at its pin. Run: uv run ansible-playbook playbooks/fish.yml --ask-become-pass
        quiet: true

- name: Install Fish through apt
  when: manage_system_packages | default(true)
  become: true
  tags: [packages]
  block:
    - name: Add the official Fish 4 PPA
      ansible.builtin.deb822_repository:
        name: fish-shell-release-4
        types: [deb]
        uris: "{{ fish_ppa_uri }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [main]
        signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x{{ fish_ppa_key_fingerprint }}"
        state: present
        mode: "0644"
      register: fish_repository

    # Only touch apt when the installed version differs from the pin, so a
    # rerun is a no-op even if the PPA has since dropped the pinned build.
    - name: Check the installed Fish version
      ansible.builtin.command:
        argv: [dpkg-query, --show, "--showformat=${Version}", fish]
      register: fish_installed
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Determine whether Fish needs installation
      ansible.builtin.set_fact:
        fish_needs_install: "{{ fish_installed.rc != 0 or fish_installed.stdout | trim != fish_version }}"

    # Fail if the pinned package is no longer available; never fall back to latest.
    - name: Reconcile the installed Fish version
      when: fish_needs_install
      block:
        - name: Release the Fish version hold
          ansible.builtin.dpkg_selections:
            name: fish
            selection: install

        - name: Install the pinned Fish package
          ansible.builtin.apt:
            name: "fish={{ fish_version }}"
            state: present
            allow_downgrade: true
            update_cache: true
            cache_valid_time: "{{ 0 if fish_repository is changed else 3600 }}"

    # Keep apt upgrade and unattended upgrades from moving the pinned version.
    - name: Hold Fish at the pinned version
      ansible.builtin.dpkg_selections:
        name: fish
        selection: hold
