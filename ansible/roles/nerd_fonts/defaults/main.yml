---
nerd_fonts_apt_packages:
  - ca-certificates
  - fontconfig
  - tar
  - xz-utils

# Match the original install-nerd-font script. Update the checksum whenever
# changing the release or font family.
nerd_fonts_version: "3.5.1"
nerd_fonts_family: Meslo
nerd_fonts_sha256: 6b6624632dc6873dfb7681c3f818e7c01ab601ab707690b6440933bbe57e2b11
nerd_fonts_download_dir: "{{ ansible_facts['user_dir'] }}/.cache/nerd-fonts"
nerd_fonts_install_dir: "{{ ansible_facts['user_dir'] }}/.local/share/fonts/{{ nerd_fonts_family }}"
nerd_fonts_archive: "{{ nerd_fonts_download_dir }}/{{ nerd_fonts_family }}-{{ nerd_fonts_version }}.tar.xz"
