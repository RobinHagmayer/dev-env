---
rust_apt_packages:
  - build-essential # C linker, required by the Rust toolchain
  - ca-certificates # HTTPS downloads
  - curl # used by the rustup installer
rust_toolchain: "1.99.1"
rust_rustup_version: "1.29.2"
# https://static.rust-lang.org/rustup/archive/<version>/x86_64-unknown-linux-gnu/rustup-init.sha256
rust_rustup_sha256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
rust_home: "{{ ansible_facts['user_dir'] }}/.local/share/cargo"
rust_toolchain_home: "{{ ansible_facts['user_dir'] }}/.local/share/rustup"
