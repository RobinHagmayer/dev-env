---
- name: Install or validate system packages for Pulumi
  ansible.builtin.include_role:
    name: system_packages
    apply:
      tags: [packages]
  vars:
    system_packages_names: "{{ pulumi_apt_packages }}"
    system_packages_bootstrap_playbook: dev-tools.yml
  tags: [packages]

- name: Validate the pinned Pulumi release and paths
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
      - ansible_facts['architecture'] == 'x86_64'
      - pulumi_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - pulumi_sha256 is match('^[0-9a-f]{64}$')
      - pulumi_home is match('^/')
      - pulumi_download_dir is match('^/')
      - pulumi_environment_dir is match('^/')
      - pulumi_home != ansible_facts['user_dir'] ~ '/.pulumi'
    fail_msg: This pin supports Linux x86_64 only; use absolute XDG paths.

- name: Inspect the legacy Pulumi home
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.pulumi"
  register: pulumi_legacy

- name: Inspect the new Pulumi home
  ansible.builtin.stat:
    path: "{{ pulumi_home }}"
  register: pulumi_destination

- name: Refuse to replace a legacy file or symlink
  ansible.builtin.assert:
    that:
      - pulumi_legacy.stat.isdir | default(false)
      - not (pulumi_legacy.stat.islnk | default(false))
    fail_msg: Resolve the legacy Pulumi file or symlink manually.
  when: pulumi_legacy.stat.exists | default(false) or pulumi_legacy.stat.islnk | default(false)

- name: Refuse to merge two Pulumi homes
  ansible.builtin.assert:
    that:
      - not (pulumi_destination.stat.exists | default(false))
      - not (pulumi_destination.stat.islnk | default(false))
    fail_msg: Both Pulumi homes exist; resolve them manually without overwriting credentials or state.
  when: pulumi_legacy.stat.isdir | default(false)

- name: Create the Pulumi parent directory
  ansible.builtin.file:
    path: "{{ pulumi_home | dirname }}"
    state: directory
    mode: "0755"

- name: Migrate the complete legacy Pulumi home without a compatibility symlink
  ansible.builtin.command:
    argv: [mv, "{{ ansible_facts['user_dir'] }}/.pulumi", "{{ pulumi_home }}"]
  when: pulumi_legacy.stat.isdir | default(false)
  changed_when: true

- name: Create the Pulumi home and download cache
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ '0700' if item == pulumi_home else '0755' }}"
  loop:
    - "{{ pulumi_home }}"
    - "{{ pulumi_download_dir }}"

- name: Locate the current Pulumi bundle
  ansible.builtin.set_fact:
    pulumi_check_home: "{{ ansible_facts['user_dir'] ~ '/.pulumi' if ansible_check_mode and pulumi_legacy.stat.isdir | default(false) else pulumi_home }}"
    pulumi_install_id: "{{ pulumi_version }} {{ pulumi_sha256 }}"

- name: Inspect the current binary path without following links
  ansible.builtin.stat:
    path: "{{ pulumi_check_home }}/bin"
    follow: false
  register: pulumi_current_bin

- name: Refuse to replace a binary path that is not a directory or symlink
  ansible.builtin.assert:
    that: >-
      not (pulumi_current_bin.stat.exists | default(false)) or
      pulumi_current_bin.stat.isdir | default(false) or
      pulumi_current_bin.stat.islnk | default(false)

- name: Inspect the managed bundle identity
  ansible.builtin.stat:
    path: "{{ pulumi_current_bin.stat.lnk_source | dirname }}/install-id"
  register: pulumi_identity_file
  when: pulumi_current_bin.stat.islnk | default(false)

- name: Read the managed bundle identity
  ansible.builtin.slurp:
    src: "{{ pulumi_identity_file.stat.path }}"
  register: pulumi_identity
  when: pulumi_identity_file.stat.isreg | default(false)

# Hashing the recorded files is read-only, unlike 'pulumi version', which writes logs.
# Also repair executable permissions on any helper, not just the main CLI.
- name: Verify every file in the current managed binary bundle
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      sha256sum --check --quiet ../SHA256SUMS &&
      test -z "$(find . -type f ! -executable -print -quit)"
    executable: /bin/bash
    chdir: "{{ pulumi_current_bin.stat.lnk_source }}"
  register: pulumi_bundle_check
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - pulumi_current_bin.stat.islnk | default(false)
    - (pulumi_identity.content | default('') | b64decode | trim) == pulumi_install_id

- name: Determine whether Pulumi needs installation or repair
  ansible.builtin.set_fact:
    pulumi_needs_install: >-
      {{ (pulumi_identity.content | default('') | b64decode | trim) != pulumi_install_id or
         pulumi_bundle_check.rc | default(1) != 0 }}

- name: Report the planned Pulumi installation or repair
  ansible.builtin.debug:
    msg: "Would install and select the verified Pulumi {{ pulumi_version }} bundle."
  changed_when: true
  when:
    - ansible_check_mode
    - pulumi_needs_install

- name: Install and select the checksum-pinned Pulumi bundle
  ansible.builtin.include_tasks: install.yml
  when:
    - pulumi_needs_install
    - not ansible_check_mode

- name: Verify the selected Pulumi executable
  ansible.builtin.command:
    argv: ["{{ pulumi_home }}/bin/pulumi", version]
  environment:
    PULUMI_HOME: "{{ pulumi_home }}"
  register: pulumi_verified
  changed_when: false
  failed_when: pulumi_verified.rc != 0 or pulumi_verified.stdout | trim != 'v' ~ pulumi_version
  when: not ansible_check_mode

- name: Generate the shared Pulumi environment
  ansible.builtin.include_role:
    name: shell_environment
  vars:
    shell_environment_dir: "{{ pulumi_environment_dir }}"
    shell_environment_name: pulumi
    shell_environment_exports:
      PULUMI_HOME: "{{ pulumi_home }}"
    shell_environment_paths: ["{{ pulumi_home }}/bin"]
