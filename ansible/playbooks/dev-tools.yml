---
# Roles that install system packages use `become` on those tasks only (tagged
# `packages`), everything else installs into the user's home without sudo.
# Roles declare their own prerequisites or pull in a dependency role.
- name: Install base packages and developer tools
  hosts: workstations
  roles:
    - role: base_packages
      tags: [base, packages]
    - role: rust
      tags: [rust]
    - role: go
      tags: [go]
    - role: zig
      tags: [zig]
    - role: pnpm
      tags: [pnpm]
    - role: gh_stack
      tags: [gh_stack]
