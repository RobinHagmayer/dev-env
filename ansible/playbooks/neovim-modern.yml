---
# Current upstream HEAD, pinned for reproducibility. Update deliberately.
# Optional user-prefix runtime; never replaces the system binary or runtime.
- name: Build the optional isolated Neovim HEAD runtime
  hosts: workstations
  vars:
    neovim_version: "299ca3c81e2d181160c56989e7255d9930f5bd34"
    neovim_user_install: true
    neovim_src_dir: "{{ ansible_facts['user_dir'] }}/.local/src/neovim-modern"
  roles:
    - role: neovim
      tags: [neovim]
