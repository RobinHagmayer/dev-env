---
# System packages need root, so they live in their own play. Everything else
# installs into the user's home and runs without sudo.
- name: Install system prerequisites
  hosts: workstations
  become: true
  tags: [base]
  roles:
    - base_packages

- name: Install developer tools
  hosts: workstations
  roles:
    - role: rust
      tags: [rust]
    - role: go
      tags: [go]
    - role: zig
      tags: [zig]
    - role: pnpm
      tags: [pnpm]
